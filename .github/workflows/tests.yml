name: Tests

on: [push, pull_request]

jobs:
  # Proves the models/generators/adapters layers need no LaTeX install.
  test-pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pure-Python tests (no LaTeX)
        run: pytest reporting/tests -v -m "not requires_latex"

  # Full suite including end-to-end PDF compilation and the
  # float-placement regression tests.
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LaTeX (for compiler-layer tests)
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest reporting/tests -v --cov=reporting --cov-report=term-missing
